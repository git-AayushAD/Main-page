<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events - VORTEX 13.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#090d16',
            card: '#111726',
            primary: '#0ea5e9',
            accent: '#38bdf8',
            border: '#1e293b',
            muted: '#94a3b8'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background text-slate-100 min-h-screen flex flex-col font-sans selection:bg-primary selection:text-black">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 bg-background/80 backdrop-blur-md border-b border-border">
    <nav class="container mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
        <div class="h-8 w-8 rounded bg-primary flex items-center justify-center text-black font-extrabold">V</div>
        <span>VORTEX 13.0</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-sm text-muted hover:text-slate-100 hidden sm:block">Home</a>
        <button id="cart-btn" onclick="openCart()" class="relative flex items-center gap-2 bg-card hover:bg-slate-800 border border-border px-3.5 py-1.5 rounded-lg text-sm transition">
          <i data-lucide="shopping-bag" class="w-4 h-4 text-primary"></i>
          <span>Cart</span>
          <span id="cart-count" class="bg-primary text-black text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- CONTENT -->
  <main class="container mx-auto px-4 py-10 flex-grow max-w-6xl">
    
    <div class="text-center max-w-xl mx-auto mb-8 space-y-2">
      <h1 class="text-3xl sm:text-4xl font-extrabold">Competitions & Events</h1>
      <p class="text-muted text-sm">Bundle Discount: Pick 2 for 15% OFF | 3+ for 30% OFF</p>
      
      <!-- Category Filter Tabs -->
      <div class="flex justify-center gap-2 pt-4 flex-wrap">
        <button onclick="filterEvents('all')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium border border-primary bg-primary text-black transition" data-filter="all">All</button>
        <button onclick="filterEvents('Prodigy')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium border border-border bg-card text-muted hover:text-slate-100 transition" data-filter="Prodigy">Prodigy</button>
        <button onclick="filterEvents('General')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium border border-border bg-card text-muted hover:text-slate-100 transition" data-filter="General">General</button>
        <button onclick="filterEvents('Pharma')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-medium border border-border bg-card text-muted hover:text-slate-100 transition" data-filter="Pharma">Pharma</button>
      </div>
    </div>

    <!-- Cards Grid (Built Dynamically by JS) -->
    <div id="cards-container" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </main>

  <!-- SLIDE-OVER CART DRAWER -->
  <div id="cart-drawer-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden">
    <div id="cart-drawer" class="fixed right-0 top-0 h-full w-full max-w-md bg-card border-l border-border shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300">
      <div class="p-4 border-b border-border flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-4 h-4 text-primary"></i> Registration Cart
        </h3>
        <button onclick="closeCart()" class="p-1 text-muted hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-3"></div>
      <div class="p-4 border-t border-border bg-background/60 space-y-3 text-xs">
        <div class="flex justify-between text-muted"><span>Subtotal:</span><span id="cart-subtotal">₹0</span></div>
        <div class="flex justify-between text-emerald-400"><span id="cart-discount-label">Discount:</span><span id="cart-discount">- ₹0</span></div>
        <div class="flex justify-between text-sm font-bold text-slate-100 pt-2 border-t border-border"><span>Total:</span><span id="cart-total" class="text-primary">₹0</span></div>
        <button id="checkout-btn" onclick="alert('Proceeding to UPI payment modal!')" class="w-full py-2.5 rounded-lg bg-primary hover:bg-accent text-black font-bold text-xs uppercase tracking-wider transition disabled:opacity-40">
          Checkout Now
        </button>
      </div>
    </div>
  </div>

  <!-- Load the Data File -->
  <script src="events-data.js"></script>

  <!-- Controller Script -->
  <script>
    let activeFilter = 'all';
    let cart = JSON.parse(localStorage.getItem('vortex_cart') || '[]');

    // Render Event Cards
    function renderCards() {
      const container = document.getElementById('cards-container');
      const filtered = activeFilter === 'all' 
        ? festEvents 
        : festEvents.filter(e => e.series.toLowerCase() === activeFilter.toLowerCase());

      container.innerHTML = filtered.map(item => `
        <div class="rounded-xl border border-border bg-card p-6 flex flex-col justify-between hover:border-primary/40 transition">
          <div class="space-y-3">
            <div class="flex justify-between items-center text-xs">
              <span class="px-2 py-0.5 rounded font-semibold ${
                item.series === 'Prodigy' ? 'bg-blue-500/10 text-blue-400' :
                item.series === 'Pharma' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'
              }">${item.series} Series</span>
              <span class="font-bold text-slate-200">₹${item.fee}</span>
            </div>
            <a href="event-details.html?id=${item.id}" class="hover:text-primary transition block">
              <h2 class="text-xl font-bold">${item.title}</h2>
            </a>
            <p class="text-xs text-muted leading-relaxed line-clamp-3">${item.shortDesc}</p>
            <div class="text-xs text-slate-300 space-y-1 pt-2 border-t border-border/50">
              <p><span class="text-muted">Prize Pool:</span> <span class="text-emerald-400 font-semibold">${item.prizePool}</span></p>
              <p><span class="text-muted">Team:</span> ${item.teamSize}</p>
            </div>
          </div>
          <div class="mt-6 grid grid-cols-2 gap-2 pt-2">
            <a href="event-details.html?id=${item.id}" class="py-2 text-center rounded-lg border border-border hover:bg-slate-800 text-xs font-semibold transition">
              Details
            </a>
            <button onclick="addToCart('${item.id}')" class="py-2 rounded-lg bg-primary hover:bg-accent text-black text-xs font-semibold transition flex items-center justify-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function filterEvents(category) {
      activeFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter.toLowerCase() === category.toLowerCase()) {
          btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-medium border border-primary bg-primary text-black transition";
        } else {
          btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-medium border border-border bg-card text-muted hover:text-slate-100 transition";
        }
      });
      renderCards();
    }

    // Cart Handlers
    function addToCart(id) {
      if (cart.find(item => item.id === id)) {
        alert('Event is already in your cart!');
        return;
      }
      const ev = festEvents.find(e => e.id === id);
      cart.push(ev);
      saveCart();
      openCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      saveCart();
    }

    function saveCart() {
      localStorage.setItem('vortex_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const itemsContainer = document.getElementById('cart-items');
      const checkoutBtn = document.getElementById('checkout-btn');

      if (cart.length === 0) {
        itemsContainer.innerHTML = `<p class="text-center text-muted text-xs py-10">Your cart is empty.</p>`;
        document.getElementById('cart-subtotal').innerText = '₹0';
        document.getElementById('cart-discount').innerText = '- ₹0';
        document.getElementById('cart-total').innerText = '₹0';
        checkoutBtn.disabled = true;
        return;
      }

      itemsContainer.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between p-3 rounded-lg border border-border bg-background">
          <div>
            <h4 class="font-bold text-xs text-slate-200">${item.title}</h4>
            <span class="text-[10px] text-muted">${item.series} Series</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold">₹${item.fee}</span>
            <button onclick="removeFromCart('${item.id}')" class="text-rose-400 hover:text-rose-300 p-1">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      `).join('');

      const subtotal = cart.reduce((acc, c) => acc + c.fee, 0);
      let discountRate = cart.length === 2 ? 0.15 : cart.length >= 3 ? 0.30 : 0;
      const discount = Math.round(subtotal * discountRate);

      document.getElementById('cart-subtotal').innerText = `₹${subtotal}`;
      document.getElementById('cart-discount').innerText = `- ₹${discount}`;
      document.getElementById('cart-total').innerText = `₹${subtotal - discount}`;
      checkoutBtn.disabled = false;
      lucide.createIcons();
    }

    function openCart() {
      document.getElementById('cart-drawer-overlay').classList.remove('hidden');
      setTimeout(() => document.getElementById('cart-drawer').classList.remove('translate-x-full'), 10);
    }
    function closeCart() {
      document.getElementById('cart-drawer').classList.add('translate-x-full');
      setTimeout(() => document.getElementById('cart-drawer-overlay').classList.add('hidden'), 300);
    }

    // Init
    renderCards();
    updateCartUI();
  </script>
</body>
</html>
